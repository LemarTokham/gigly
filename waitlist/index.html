<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gigly — every gig, remembered</title>
    <meta name="description" content="A journal for live music. Log every gig, rate it, and see what the crowd really thought. Launching soon — join the waitlist." />

    <!-- Open Graph: how the link looks when shared on socials / iMessage -->
    <meta property="og:title" content="gigly — every gig, remembered" />
    <meta property="og:description" content="A journal for live music. Launching soon — join the waitlist." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://justgigly.com" />

    <link rel="icon" type="image/png" href="/gigly-ticket.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Special+Elite&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <img class="logo" src="/gigly-ticket.png" alt="gigly" />

      <h1 class="headline">every gig, remembered.</h1>

      <p class="sub">
        a journal for live music. log every show, rate it
        <span class="tier loved">loved</span> /
        <span class="tier mid">mid</span> /
        <span class="tier nah">nah</span>, and see how the crowd for your
        favourite artists really felt.
      </p>

      <p class="hand">launching soon — get on the list.</p>

      <!-- The form. JS intercepts the submit and POSTs to /api/join -->
      <form id="join" class="form" novalidate>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="first name"
          autocomplete="given-name"
          maxlength="80"
          required
        />
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@email.com"
          autocomplete="email"
          required
        />
        <button id="submit" type="submit">join the waitlist</button>
      </form>

      <p id="msg" class="msg" role="status" aria-live="polite"></p>

      <p class="fineprint">no spam. just a note when it's ready.</p>

      <!-- Success state, hidden until signup completes -->
      <div id="done" class="done" hidden>
        <div class="stamp">YOU'RE IN</div>
        <p class="done-line" id="done-line">nice one. we'll be in touch.</p>
      </div>

      <footer class="footer">
        <span>gigly · concert journal</span>
      </footer>
    </main>

    <script src="/join.js"></script>
  </body>
</html>
